<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTERFRIOS TV</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000000; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
  #stage { position:absolute; top:0; left:0; width:100%; height:100%; background:#000000; }
  #player-video, #player-img, #live-img {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:contain; background:#000000; display:none;
  }
  #pair { position:absolute; top:0; left:0; width:100%; height:100%; text-align:center; color:#FFFFFF; background:#000000; }
  #pair img { margin-top:6%; width:38%; }
  .lbl { font-size:28px; margin-top:36px; color:#FFFFFF; }
  #code { font-size:120px; font-weight:bold; color:#FFC700; letter-spacing:14px; margin-top:10px; }
  .inst { font-size:28px; margin-top:20px; color:#FFFFFF; }
  .slogan { font-size:20px; margin-top:40px; color:#FFC700; }
  #status { position:absolute; bottom:10px; right:14px; color:#444444; font-size:14px; }
  #loading { position:absolute; top:0; left:0; width:100%; height:100%; text-align:center; color:#FFFFFF; background:#000000; }
  #loading img { margin-top:16%; width:30%; opacity:0.85; }
  .loadtxt { font-size:26px; margin-top:40px; color:#FFC700; opacity:0.8; }
  #livetag { position:absolute; top:18px; left:18px; background:#D32F2F; color:#FFFFFF; font-size:20px; font-weight:bold; padding:6px 14px; display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="player-video" muted playsinline webkit-playsinline autoplay style="width:100%; height:100%; object-fit:contain; background:#000; display:none;"></video>
  <img id="player-img" alt="">
  <img id="live-img" alt="">
  <div id="livetag">AO VIVO</div>

  <div id="pair">
    <img src="/logo.png" alt="CENTERFRIOS">
    <div class="lbl">C&oacute;digo de pareamento desta TV</div>
    <div id="code">------</div>
    <div class="inst">Acesse o painel no celular para ativar esta TV</div>
    <div class="slogan">CENTERFRIOS &mdash; Crescendo com voc&ecirc;</div>
  </div>

  <div id="loading" class="hidden">
    <img src="/logo.png" alt="CENTERFRIOS">
    <div class="loadtxt">Carregando m&iacute;dias...</div>
  </div>

  <div id="status"></div>
</div>
<script type="text/javascript">
/* CENTERFRIOS TV Player - ES5 puro, sem modulos, compativel com Saphi OS */
(function () {
  var SUPA_URL = "https://ovrgtfpcjowptktrtzir.supabase.co";
  var SUPA_KEY = "sb_publishable_crlEYmYyg709iLRqJate8w_2qemA7Xk";
  var K_ID = "cf_tv_id";
  var K_CODE = "cf_tv_code";
  var K_PL = "cf_playlist_cache";
  var K_UUID = "centerfrios_device_uuid";

  var VIDEO_TIMEOUT_MS = 8000;
  var HEARTBEAT_MS = 8000;
  var POLL_MS = 3000;
  var LIVE_MS = 900;

  var pairEl = document.getElementById("pair");
  var codeEl = document.getElementById("code");
  var statusEl = document.getElementById("status");
  var loadingEl = document.getElementById("loading");
  var videoEl = document.getElementById("player-video");
  var imgEl = document.getElementById("player-img");
  var liveEl = document.getElementById("live-img");
  var liveTag = document.getElementById("livetag");

  var tvId = null;
  var items = [];
  var idx = 0;
  var playing = false;
  var currentPlaylistId = null;
  var timer = null;
  var stallTimer = null;
  var fails = 0;
  var token = 0;
  var isLive = false;
  var liveTimer = null;
  var preloader = new Image();

  function show(el, on) { el.style.display = on ? "block" : "none"; }
  function ls(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  function req(method, path, body, cb) {
    var url = SUPA_URL + path;
    var done = false;
    function finish(err, data) { if (!done) { done = true; cb(err, data); } }
    var headers = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };
    if (typeof window.fetch === "function") {
      var opts = { method: method, headers: headers };
      if (body) { opts.body = JSON.stringify(body); }
      window.fetch(url, opts).then(function (r) {
        return r.text();
      }).then(function (t) {
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
        finish(null, d);
      })["catch"](function (e) { finish(e, null); });
      return;
    }
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    for (var h in headers) { if (headers.hasOwnProperty(h)) { xhr.setRequestHeader(h, headers[h]); } }
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          var d = null;
          try { d = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (e) { d = null; }
          finish(null, d);
        } else {
          finish(new Error("HTTP " + xhr.status), null);
        }
      }
    };
    xhr.send(body ? JSON.stringify(body) : null);
  }

  function genCode() {
    var c = "";
    for (var i = 0; i < 6; i++) { c += String(Math.floor(Math.random() * 10)); }
    return c;
  }

  function stopMedia() {
    token = token + 1;
    if (timer) { clearTimeout(timer); timer = null; }
    if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
    try { videoEl.pause(); } catch (e) {}
    show(videoEl, false);
    show(imgEl, false);
  }

  function showPairing(code) {
    codeEl.innerHTML = code;
    pairEl.className = "";
    loadingEl.className = "hidden";
    stopMedia();
    playing = false;
  }

  function showLoading(on) {
    loadingEl.className = on ? "" : "hidden";
    if (on) { stopMedia(); }
  }

  /* ---------- boot: device_uuid persistente, nunca duplica TV ---------- */
  function genUuid() {
    var s = "";
    for (var i = 0; i < 32; i++) { s += "0123456789abcdef".charAt(Math.floor(Math.random() * 16)); }
    return "dev-" + s + "-" + String(new Date().getTime());
  }

  function cookieGet(name) {
    try {
      var parts = String(document.cookie || "").split(";");
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i].replace(/^\s+/, "");
        if (p.indexOf(name + "=") === 0) { return decodeURIComponent(p.slice(name.length + 1)); }
      }
    } catch (e) {}
    return null;
  }
  function cookieSet(name, value) {
    try {
      document.cookie = name + "=" + encodeURIComponent(value) + ";path=/;max-age=315360000;SameSite=Lax";
    } catch (e) {}
  }

  function boot() {
    codeEl.innerHTML = "";
    document.getElementsByClassName("lbl")[0].innerHTML = "Conectando ao servidor e gerando c&oacute;digo...";
    pairEl.className = "";

    var uuid = ls(K_UUID) || cookieGet(K_UUID);
    if (!uuid) { uuid = genUuid(); }
    lsSet(K_UUID, uuid);
    cookieSet(K_UUID, uuid);

    var cached = ls(K_PL);
    if (cached) {
      try {
        var arr = JSON.parse(cached);
        if (arr && arr.length) { items = arr; }
      } catch (e) {}
    }

    registerOnce(uuid, 0);
  }

  function registerOnce(uuid, attempt) {
    // codigo de pareamento e SEMPRE gerado pelo servidor
    req("POST", "/rest/v1/rpc/register_tv_device", { p_device_uuid: uuid }, function (err, data) {
      if (!err && data && data.id && data.pairing_code) {
        tvId = data.id;
        lsSet(K_ID, data.id);
        lsSet(K_CODE, data.pairing_code);
        document.getElementsByClassName("lbl")[0].innerHTML = "C&oacute;digo de pareamento desta TV";
        showPairing(data.pairing_code);
        ready();
        return;
      }
      var delays = [3000, 5000, 10000];
      var wait = delays[attempt < delays.length ? attempt : delays.length - 1];
      document.getElementsByClassName("lbl")[0].innerHTML = "Aguardando resposta da nuvem... Revalidando em " + (wait / 1000) + "s";
      setTimeout(function () { registerOnce(uuid, attempt + 1); }, wait);
    });
  }



  function ready() {
    poll();
    ping();
    setInterval(poll, POLL_MS);
    setInterval(ping, HEARTBEAT_MS);
  }

  function ping() {
    if (!tvId) { return; }
    req("POST", "/rest/v1/rpc/tv_ping", { _id: tvId }, function () {});
  }

  /* ---------- polling de estado ---------- */
  function poll() {
    if (!tvId) { return; }
    req("GET", "/rest/v1/tvs?id=eq." + tvId + "&select=id,is_paired,playlist_id,is_live_active", null, function (err, rows) {
      if (err || !rows || !rows.length) {
        statusEl.innerHTML = "sem conexao";
        if (!isLive && !playing && items.length) { startLoop(); }
        return;
      }
      statusEl.innerHTML = "";
      var tv = rows[0];

      if (!tv.is_paired) { setLive(false); showPairing(ls(K_CODE) || ""); return; }
      pairEl.className = "hidden";

      if (tv.is_live_active) { setLive(true); return; }
      setLive(false);

      if (tv.playlist_id !== currentPlaylistId) {
        currentPlaylistId = tv.playlist_id;
        if (!items.length) { showLoading(true); }
        loadPlaylist(tv.playlist_id);
      } else if (!playing && items.length) {
        startLoop();
      } else if (!playing && !items.length) {
        showLoading(true);
      }
    });
  }

  /* ---------- modo ao vivo (quadros base64) ---------- */
  function setLive(on) {
    if (on === isLive) { return; }
    isLive = on;
    if (on) {
      stopMedia();
      playing = false;
      loadingEl.className = "hidden";
      liveTag.style.display = "block";
      fetchFrame();
      liveTimer = setInterval(fetchFrame, LIVE_MS);
    } else {
      if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
      liveTag.style.display = "none";
      show(liveEl, false);
    }
  }

  function fetchFrame() {
    req("GET", "/rest/v1/live_frames?select=frame_data,created_at&order=created_at.desc&limit=1", null, function (err, rows) {
      if (err || !rows || !rows.length) { return; }
      liveEl.src = rows[0].frame_data;
      show(liveEl, true);
    });
  }

  /* ---------- playlist ---------- */
  function loadPlaylist(pid) {
    if (!pid) { showLoading(true); return; }
    req("POST", "/rest/v1/rpc/get_tv_playlist_items", { p_playlist_id: pid }, function (err, rows) {
      if (err || !rows) { if (!playing) { showLoading(true); } return; }
      var list = [];
      for (var j = 0; j < rows.length; j++) {
        if (!rows[j] || !rows[j].url) { continue; }
        list.push({
          url: rows[j].url,
          type: rows[j].type,
          duration: rows[j].duration || 10
        });
      }
      items = list;
      idx = 0;
      try { lsSet(K_PL, JSON.stringify(list)); } catch (e) {}
      if (items.length) { startLoop(); } else { showLoading(true); }
    });
  }


  function startLoop() {
    if (isLive) { return; }
    if (!items.length) { showLoading(true); return; }
    playing = true;
    fails = 0;
    pairEl.className = "hidden";
    loadingEl.className = "hidden";
    render();
  }

  function next() {
    if (isLive) { return; }
    if (!items.length) { playing = false; showLoading(true); return; }
    if (fails >= items.length) {
      playing = false;
      showLoading(true);
      timer = setTimeout(function () { fails = 0; startLoop(); }, 15000);
      return;
    }
    idx = (idx + 1) % items.length;
    render();
  }

  function fail() {
    fails = fails + 1;
    next();
  }

  function render() {
    if (isLive) { return; }
    if (!items.length) { showLoading(true); return; }

    stopMedia();
    var my = token;
    pairEl.className = "hidden";
    loadingEl.className = "hidden";

    var it = items[idx % items.length];

    if (it.type === "video") {
      show(imgEl, false);
      show(videoEl, true);

      videoEl.muted = true;
      videoEl.setAttribute("muted", "");
      videoEl.setAttribute("playsinline", "");
      videoEl.setAttribute("webkit-playsinline", "");
      videoEl.setAttribute("preload", "metadata");
      videoEl.preload = "metadata";

      var handled = false;
      function finishVideo(ok) {
        if (handled || my !== token) { return; }
        handled = true;
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
        if (ok) { fails = 0; next(); } else { show(videoEl, false); fail(); }
      }
      videoEl.onerror = function () { finishVideo(false); };
      videoEl.onended = function () { finishVideo(true); };
      videoEl.onplaying = function () {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      };
      videoEl.onloadeddata = function () {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      };

      // timeout de seguranca de 8s: sem buffer -> pula
      stallTimer = setTimeout(function () {
        stallTimer = null;
        if (my !== token) { return; }
        if (!videoEl.readyState || videoEl.readyState < 2) { finishVideo(false); }
      }, VIDEO_TIMEOUT_MS);

      try { videoEl.src = it.url; } catch (e) {}
      try { videoEl.load(); } catch (e) {}
      try { videoEl.currentTime = 0; } catch (e) {}
      try {
        var pr = videoEl.play();
        if (pr && typeof pr["catch"] === "function") {
          pr["catch"](function () { finishVideo(false); });
        }
      } catch (e) { finishVideo(false); }

      // limite absoluto: 10 min por video
      timer = setTimeout(function () { finishVideo(true); }, 600000);
    } else {
      show(videoEl, false);
      show(imgEl, true);
      var imgDone = false;
      imgEl.onerror = function () {
        if (imgDone || my !== token) { return; }
        imgDone = true;
        show(imgEl, false);
        fail();
      };
      imgEl.onload = function () { fails = 0; };
      imgEl.src = it.url;
      var secs = it.duration > 2 ? it.duration : 10;
      timer = setTimeout(function () {
        if (imgDone || my !== token) { return; }
        imgDone = true;
        next();
      }, secs * 1000);
    }

    // pre-buffer leve do proximo item (somente imagens; video pesa RAM)
    if (items.length > 1) {
      var nx = items[(idx + 1) % items.length];
      if (nx.type !== "video") {
        try { preloader.src = nx.url; } catch (e) {}
      }
    }
  }

  boot();
})();
</script>
</body>
</html>
